# SPDX-License-Identifier: GPL-2.0-only
name: Bridge check

# The Explorer eval page (web/htdocs/json_api/vue-eval.html) binds at runtime to
# the *site's own* cmk-frontend-vue bundle. That bundle is internal and
# unversioned, so this workflow boots real Checkmk containers, installs the MKP,
# and drives a headless browser at the page to prove a native component still
# mounts. A red build is the earliest signal that a Checkmk release changed the
# custom-element names or the `data` contract the Explorer relies on.
#
# Runs weekly (drift catch as dailies move) and on demand only — NOT on PRs,
# to keep container + browser time out of unrelated changes.
#
# From 2.5 on, Checkmk publishes its free edition as checkmk/check-mk-community;
# checkmk/check-mk-raw stops at 2.4 (its last 2.5.0 tag is the 2025-11-04 beta
# daily). Resolving 2.5 against check-mk-raw silently pinned this check to that
# stale beta, so it went red every week without testing a current site.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bridge-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Build the Explorer's wizard bundle first (same composite action the
      # frontend-build and release workflows use). Without it, build_mkp.py has
      # no wizard to package and build_explorer() hard-fails on the missing
      # web/htdocs/json_api/wizard/.vite/manifest.json.
      - name: Build the Explorer frontend
        uses: ./.github/actions/build-frontend

      - name: Build the Explorer MKP
        id: build
        run: |
          set -euo pipefail
          python3 scripts/build_mkp.py --package explorer
          VERSION="$(python3 -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -l "json_api_explorer-$VERSION.mkp"

      - name: Install Playwright (Python) + Chromium
        run: |
          pip install playwright pytest
          playwright install --with-deps chromium

      # The newest daily of each line. Dated tags are pruned and 3.0.0 has no
      # floating '-daily' tag, so they are resolved at run time. 3.0 is where
      # cmk-frontend-vue's shared code moves into cmk-ui-library, so it is the
      # earliest warning that the next release breaks the bridge.
      - name: Resolve the Checkmk images to test against
        id: images
        run: |
          set -euo pipefail
          repo=checkmk/check-mk-community
          newest_daily() {
            curl -fsSL "https://hub.docker.com/v2/repositories/$repo/tags/?page_size=100&ordering=last_updated&name=$1" \
              | python3 -c "import sys, json; ts=[t['name'] for t in json.load(sys.stdin)['results'] if t['name'].startswith('$1')]; print(sorted(ts)[-1] if ts else '')"
          }
          # The Explorer MKP requires Checkmk >= 2.5.0, so only smoke it on 2.5.0+
          # sites (the agent's 2.4 support is covered by the main CI 'test' job).
          images=""
          for line in 2.5.0 3.0.0; do
            tag="$(newest_daily "$line-2" || true)"
            [ -n "$tag" ] || { echo "::error::no $repo $line daily image found"; exit 1; }
            images="$images $repo:$tag"
          done
          echo "list=$images" >> "$GITHUB_OUTPUT"
          echo "Testing against:$images"

      - name: Bridge smoke against each Checkmk site
        env:
          CMK_PASSWORD: "S3cure_cmk_bridge_pw"
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          set -uo pipefail
          rc=0
          for img in ${{ steps.images.outputs.list }}; do
            echo "::group::$img"
            docker rm -f cmk >/dev/null 2>&1 || true
            docker run -d --name cmk -p 5000:5000 -e CMK_PASSWORD="$CMK_PASSWORD" "$img" >/dev/null

            # Wait for the site apache to serve the GUI (fresh sites take a bit).
            ready=""
            for _ in $(seq 1 60); do
              code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/cmk/check_mk/login.py || true)"
              if [ "$code" = "200" ]; then ready=1; break; fi
              sleep 3
            done
            if [ -z "$ready" ]; then
              echo "::error::site did not come up for $img"
              docker logs cmk 2>&1 | tail -50
              docker rm -f cmk >/dev/null 2>&1 || true
              rc=1; echo "::endgroup::"; continue
            fi

            # Install the freshly built Explorer package into the running site.
            # Static htdocs assets are served straight off disk — no restart.
            docker cp "json_api_explorer-$VERSION.mkp" cmk:/tmp/pkg.mkp
            docker exec cmk su -l cmk -c "mkp add /tmp/pkg.mkp && mkp enable json_api_explorer $VERSION"

            # Drive a real browser at the bridge page (see tests/bridge/).
            if CMK_SITE_URL="http://localhost:5000/cmk" python3 -m pytest tests/bridge -q; then
              echo "bridge OK on $img"
            else
              echo "::error::bridge smoke failed on $img"
              docker logs cmk 2>&1 | tail -50
              rc=1
            fi

            docker rm -f cmk >/dev/null 2>&1 || true
            echo "::endgroup::"
          done
          exit $rc
