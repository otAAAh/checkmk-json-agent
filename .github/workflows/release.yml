# SPDX-License-Identifier: GPL-2.0-only
name: Release

# Cut a release by pushing an annotated version tag:
#   git tag -a vX.Y.Z -m "Release X.Y.Z" && git push origin vX.Y.Z
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags so the changelog can diff versions

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Derive version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Verify the tag matches the pyproject version
        run: |
          pyproject_version="$(python3 -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$pyproject_version" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $pyproject_version"
            exit 1
          fi

      - name: Build the MKP
        run: python3 scripts/build_mkp.py

      - name: Generate the release notes
        run: python3 scripts/gen_changelog.py --version "$VERSION" > release-notes.md

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            json_api-"$VERSION".mkp
