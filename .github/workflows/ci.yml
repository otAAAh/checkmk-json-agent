# SPDX-License-Identifier: GPL-2.0-only
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-progress run when the same ref is pushed again (e.g. a new commit
# on a PR), so superseded runs don't pile up and contend for runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + tags so the changelog check can diff versions
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Dev tooling is pinned in requirements-dev.txt (Dependabot-tracked). The
      # runtime deps (cmk.*, requests) stay covered by mypy's ignore_missing_imports.
      - run: pip install -r requirements-dev.txt
      # 'gui' ships in the Explorer MKP, so it is production code and is checked
      # like the rest. Keep these paths in lock-step with RUFF_SOURCES /
      # MYPY_SOURCES in the Makefile, so `make format lint typecheck` cannot pass
      # while CI fails. mypy omits 'tests' on purpose: the suite is deliberately
      # untyped and disallow_untyped_defs is on globally.
      - name: Format check
        run: ruff format --check cmk_addons scripts tests gui
      - name: Lint
        run: ruff check cmk_addons scripts tests gui
      - name: Type check
        run: mypy cmk_addons scripts gui
      # Only the agent package here: it is the stdlib-only, GUI-free one. The
      # Explorer package needs the built wizard bundle (see the frontend-build
      # and release workflows) and build_explorer() now refuses to package
      # without it, so building it on this frontend-less checkout would fail.
      - name: Build agent MKP (stdlib only)
        run: python3 scripts/build_mkp.py --package agent
      - name: Changelog is current (released sections)
        run: |
          python3 scripts/gen_changelog.py --stdout > /tmp/fresh-changelog.md
          # Compare from the first version header onward, ignoring the volatile
          # [Unreleased] section and the preamble. Released sections are derived
          # purely from tags, so they should never drift from the committed file.
          sed -n '/^## \[[0-9]/,$p' CHANGELOG.md > /tmp/committed-released.md
          sed -n '/^## \[[0-9]/,$p' /tmp/fresh-changelog.md > /tmp/fresh-released.md
          if ! diff -u /tmp/committed-released.md /tmp/fresh-released.md; then
            echo "::error::CHANGELOG.md released sections are stale — run 'make changelog' and commit."
            exit 1
          fi
      - name: Install gettext (for translation checks)
        run: sudo apt-get update && sudo apt-get install -y gettext
      - name: Translation catalogs are in sync with the source strings
        run: make check-po

  # The pytest suite imports the cmk.* plugin APIs, which only exist inside a
  # Checkmk site, so we run it inside the official Checkmk container(s), whose
  # site Python already ships pytest, requests and pydantic.
  #
  # The plugin targets 2.4+, and the agent branches on the password-store API
  # (public cmk.password_store.v1_unstable on 2.5+, internal fallback on 2.4),
  # so every release line with a public image is exercised: 2.4, 2.5 and 3.0.
  #
  # Each line is resolved at run time rather than hard-coded, because they are
  # published differently and that changes over time: a released line carries a
  # floating '<line>-latest', an in-development one only dated dailies that are
  # eventually pruned, and a line too new to have either has no image at all.
  # A line with no image is skipped with a notice rather than failing the build
  # - that is what lets 3.0 sit here and start testing itself the day its images
  # appear, at no cost until then. The flip side is that a silent skip is how a
  # line quietly stops being covered, so the step is loud about what it found:
  # it annotates a line it could not resolve, warns when the newest image a line
  # offers has gone stale, and fails outright if NOTHING resolved (which would
  # otherwise be a green run that tested nothing).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve the Checkmk images to test against
        id: images
        run: |
          set -uo pipefail
          # The newest image for a release line: its floating '-latest' where it
          # has one, else the newest dated daily, else nothing.
          newest() {
            curl -fsSL "https://hub.docker.com/v2/repositories/checkmk/check-mk-raw/tags/?page_size=100&name=$1" \
              | python3 -c "import sys, json; p='$1'; t=[x['name'] for x in json.load(sys.stdin)['results'] if x['name'].startswith(p)]; l=[x for x in t if x.endswith('-latest')]; d=sorted(x for x in t if x.startswith(p+'-2')); print(l[0] if l else (d[-1] if d else ''))"
          }
          # Age of a dated tag in days; nothing for a floating one.
          age_days() {
            d="${1##*-}"
            case "$d" in
              [0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9])
                echo $(( ( $(date +%s) - $(date -d "${d//./-}" +%s) ) / 86400 )) ;;
            esac
          }
          images=""
          for line in 2.4.0 2.5.0 3.0.0; do
            tag="$(newest "$line" || true)"
            if [ -z "$tag" ]; then
              echo "::notice::no public check-mk-raw image for $line yet - that line is not tested"
              continue
            fi
            images="$images checkmk/check-mk-raw:$tag"
            age="$(age_days "$tag")"
            if [ -n "$age" ] && [ "$age" -gt 120 ]; then
              echo "::warning::$line resolves to $tag, $age days old - the newest daily published for that line. Its coverage is that old too."
            else
              echo "$line -> $tag${age:+ ($age days old)}"
            fi
          done
          if [ -z "$images" ]; then
            echo "::error::no Checkmk image resolved for any release line - refusing to report a pass that tested nothing"
            exit 1
          fi
          echo "list=$images" >> "$GITHUB_OUTPUT"
          echo "Testing against:$images"
      - name: Run pytest inside each Checkmk site Python
        run: |
          set -uo pipefail
          rc=0
          for img in ${{ steps.images.outputs.list }}; do
            echo "::group::$img"
            docker run --rm --entrypoint bash -v "$PWD:/w" -w /w "$img" -c '
              set -e
              SITE_PY="$(ls /omd/versions/*/bin/python3 | head -1)"
              "$SITE_PY" --version
              "$SITE_PY" -m pytest --version
              "$SITE_PY" -m pytest tests -q
            ' || { echo "::error::tests failed on $img"; rc=1; }
            echo "::endgroup::"
          done
          exit $rc

  # The wizard's TypeScript that needs NO Checkmk checkout: the path grammar,
  # the wizard's state model and the REST/AJAX client. The Vue components are
  # covered by the frontend build (frontend-build.yml, which needs a cmk clone
  # plus a Docker image for the theme assets); this runs on a plain runner in
  # seconds, and it is the only job that reports a TYPE error at all — the
  # bundler strips types without resolving them, so a missing type import builds
  # perfectly happily. Node ships on the runner, so no setup-node step.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - name: Type check (the modules that need no cmk bridge)
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  # The standalone Explorer (explorer/index.html) is a hand-written mirror of the
  # config schema; this drives its real output generators (via Node) and checks
  # they still cover every required ruleset field. Runs on a plain runner - it
  # needs Node and only AST-parses the ruleset, so no Checkmk site is required.
  explorer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Explorer stays in sync with the ruleset schema
        run: python3 -m pytest tests/test_explorer.py -q

# To run the suite locally without the container, point make at a Checkmk dev venv:
#   PYTHON=/path/to/checkmk/.venv/bin/python make test
