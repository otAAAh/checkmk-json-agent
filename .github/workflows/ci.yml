name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # full history + tags so the changelog check can diff versions
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      # Pinned to the versions used for local development, for parity.
      # pydantic is needed for mypy to type-check the server-side call; the other
      # runtime deps (cmk.*, requests) stay covered by ignore_missing_imports.
      - run: pip install ruff==0.15.8 mypy==1.13.0 pydantic==2.11.7
      - name: Format check
        run: ruff format --check cmk_addons scripts tests
      - name: Lint
        run: ruff check cmk_addons scripts tests
      - name: Type check
        run: mypy cmk_addons scripts
      - name: Build MKP (stdlib only)
        run: python3 scripts/build_mkp.py
      - name: Changelog is current (released sections)
        run: |
          python3 scripts/gen_changelog.py --stdout > /tmp/fresh-changelog.md
          # Compare from the first version header onward, ignoring the volatile
          # [Unreleased] section and the preamble. Released sections are derived
          # purely from tags, so they should never drift from the committed file.
          sed -n '/^## \[[0-9]/,$p' CHANGELOG.md > /tmp/committed-released.md
          sed -n '/^## \[[0-9]/,$p' /tmp/fresh-changelog.md > /tmp/fresh-released.md
          if ! diff -u /tmp/committed-released.md /tmp/fresh-released.md; then
            echo "::error::CHANGELOG.md released sections are stale — run 'make changelog' and commit."
            exit 1
          fi

  # The pytest suite imports the cmk.* plugin APIs, which only exist inside a
  # Checkmk site, so we run it inside the official Checkmk container(s), whose
  # site Python already ships pytest, requests and pydantic.
  #
  # The plugin targets 2.4+, and the agent branches on the password-store API
  # (public cmk.password_store.v1_unstable on 2.5+, internal fallback on 2.4),
  # so we exercise BOTH lines: the stable 2.4 image and the newest 2.5 build.
  # 2.5 has no floating '-latest' tag yet and its dated dailies are eventually
  # pruned, so the 2.5 tag is resolved at run time instead of hard-coded.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Resolve the Checkmk images to test against
        id: images
        run: |
          set -euo pipefail
          newest_daily() {
            curl -fsSL "https://hub.docker.com/v2/repositories/checkmk/check-mk-raw/tags/?page_size=100&name=$1" \
              | python3 -c "import sys, json; ts=[t['name'] for t in json.load(sys.stdin)['results'] if t['name'].startswith('$1')]; print(sorted(ts)[-1] if ts else '')"
          }
          images="checkmk/check-mk-raw:2.4.0-latest"
          v25="$(newest_daily 2.5.0-2 || true)"
          [ -n "$v25" ] && images="$images checkmk/check-mk-raw:$v25"
          echo "list=$images" >> "$GITHUB_OUTPUT"
          echo "Testing against: $images"
      - name: Run pytest inside each Checkmk site Python
        run: |
          set -uo pipefail
          rc=0
          for img in ${{ steps.images.outputs.list }}; do
            echo "::group::$img"
            docker run --rm --entrypoint bash -v "$PWD:/w" -w /w "$img" -c '
              set -e
              SITE_PY="$(ls /omd/versions/*/bin/python3 | head -1)"
              "$SITE_PY" --version
              "$SITE_PY" -m pytest --version
              "$SITE_PY" -m pytest tests -q
            ' || { echo "::error::tests failed on $img"; rc=1; }
            echo "::endgroup::"
          done
          exit $rc

  # The standalone Explorer (explorer/index.html) is a hand-written mirror of the
  # config schema; this drives its real output generators (via Node) and checks
  # they still cover every required ruleset field. Runs on a plain runner - it
  # needs Node and only AST-parses the ruleset, so no Checkmk site is required.
  explorer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install pytest==8.3.4
      - name: Explorer stays in sync with the ruleset schema
        run: python3 -m pytest tests/test_explorer.py -q

# To run the suite locally without the container, point make at a Checkmk dev venv:
#   PYTHON=/path/to/checkmk/.venv/bin/python make test
