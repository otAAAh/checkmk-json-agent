# SPDX-License-Identifier: GPL-2.0-only
name: Frontend build (Explorer wizard)

# Builds the Explorer's Vue app, which imports the REAL cmk-frontend-vue
# components (CmkWizard, ...) via the build-time bridge in frontend/vite.config.ts
# — no vendoring. The build assembles three Checkmk artifacts from two sources,
# a recipe validated locally end-to-end:
#   • SOURCE  — shallow sparse clone of PUBLIC github.com/Checkmk/checkmk at a
#               pinned ref (>= 2.5.0; CmkWizard does NOT exist in 2.4): gives
#               cmk-frontend-vue/src (+ ui-component-library) and the
#               cmk-shared-typing JSON schemas.
#   • BUILT   — compiled cmk-frontend theme images (imported via `~cmk-frontend/`),
#               lifted from the MATCHING checkmk/check-mk-raw image's htdocs. The
#               image version MUST match the clone ref, or icons.constants.ts will
#               reference assets missing from an older dist.
#
# NOTE: once cmk-frontend-vue's wizard uses CmkMultitoneIcon (lazy inline SVGs)
# instead of the raster CmkIcon, the `~cmk-frontend` dist dependency disappears
# and the whole BUILT/Docker step can be dropped.
#
# Output (web/htdocs/json_api/wizard/) ships in the json_api_explorer MKP via the
# `web` part; build_mkp.py stays stdlib and just packages web/.
on:
  workflow_dispatch:
    inputs:
      cmk_ref:
        description: "Checkmk git ref (>=2.5) to build cmk-frontend-vue from"
        required: false
        default: "2.5.0"
        type: string
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CMK_REF: ${{ inputs.cmk_ref || '2.5.0' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@39370e3970a6d051c3f4a4494c944b0e1cf6c2f6 # v4.1.0
        with:
          node-version: "22"

      # --- SOURCE: sparse shallow clone of just the packages we compile against
      - name: Clone Checkmk source at pinned ref (sparse)
        run: |
          git clone --filter=blob:none --depth 1 --branch "$CMK_REF" --sparse \
            https://github.com/Checkmk/checkmk cmk-src
          git -C cmk-src sparse-checkout set \
            packages/cmk-frontend-vue packages/cmk-frontend packages/cmk-shared-typing
          test -f cmk-src/packages/cmk-frontend-vue/src/components/CmkWizard/CmkWizard.vue \
            || { echo "::error::CmkWizard not found at $CMK_REF — needs Checkmk >= 2.5"; exit 1; }
          echo "CMK_SRC=$PWD/cmk-src" >> "$GITHUB_ENV"

      # cmk-frontend-vue's RUNTIME deps (class-variance-authority, radix-vue, ...)
      # must sit next to its src for the components' bare imports to resolve. 2.5
      # ships no per-package lockfile, so `npm install --omit=dev` (skips the heavy
      # devDeps — vite/eslint/etc. we don't need). The two @tsconfig/* configs are
      # needed only so esbuild can parse the checkout's tsconfig chain.
      - name: Install cmk-frontend-vue runtime deps
        working-directory: cmk-src/packages/cmk-frontend-vue
        run: |
          npm install --omit=dev --no-audit --no-fund
          npm install --no-save --no-audit --no-fund @tsconfig/node22 @vue/tsconfig

      # cmk-shared-typing: generate TypeScript from the committed JSON schemas with
      # json-schema-to-typescript directly (the package's `./run -b` is a bazel
      # wrapper that a sparse clone can't drive). Types are erased from the output
      # but the files must exist at build time.
      - name: Generate cmk-shared-typing TypeScript
        working-directory: cmk-src/packages/cmk-shared-typing
        run: |
          mkdir -p typescript
          # Run from source/ so schemas' relative $refs (e.g. vue_formspec/*.json,
          # used by vue_formspec_components.json) resolve against source/.
          ( cd source && for f in *.json; do
              npx --yes json-schema-to-typescript@latest -i "$f" -o "../typescript/${f%.json}.ts"
            done )
          echo "CMK_SHARED_TYPING=$PWD" >> "$GITHUB_ENV"

      # --- BUILT: lift the version-matched cmk-frontend theme assets from Docker
      - name: Resolve a matching check-mk-raw image
        id: img
        run: |
          series="${CMK_REF%.0}"   # 2.5.0 -> 2.5
          newest="$(curl -fsSL "https://hub.docker.com/v2/repositories/checkmk/check-mk-raw/tags/?page_size=100&name=${series}.0-2" \
            | python3 -c "import sys,json;ts=[t['name'] for t in json.load(sys.stdin)['results'] if t['name'].startswith('${series}.0-2')];print(sorted(ts)[-1] if ts else '')")"
          test -n "$newest" || { echo "::error::no check-mk-raw image for ${series}"; exit 1; }
          echo "image=checkmk/check-mk-raw:$newest" >> "$GITHUB_OUTPUT"
      - name: Extract cmk-frontend dist from the image
        run: |
          IMG="${{ steps.img.outputs.image }}"
          VER="$(docker run --rm --entrypoint bash "$IMG" -c 'ls /omd/versions | grep -v "^default$" | head -1')"
          docker create --name cmk "$IMG" >/dev/null
          docker cp "cmk:/omd/versions/$VER/share/check_mk/web/htdocs" ./cmk-frontend-dist
          docker rm cmk >/dev/null
          echo "CMK_FRONTEND_DIST=$PWD/cmk-frontend-dist" >> "$GITHUB_ENV"

      # --- BUILD our app against the assembled artifacts, then package the MKP
      - name: Build the Explorer wizard + assemble web/
        env:
          CMK_FRONTEND_VUE_SRC: ${{ env.CMK_SRC }}/packages/cmk-frontend-vue/src
        run: |
          (cd frontend && npm ci && npm run lint:style && npm run build)
          mkdir -p web/htdocs/json_api/wizard
          cp -r frontend/dist/. web/htdocs/json_api/wizard/
      - name: Build the Explorer MKP
        run: |
          python3 scripts/build_mkp.py --package explorer
          ls -l json_api_explorer-*.mkp
      - name: Upload the Explorer MKP
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: json_api_explorer-mkp
          path: json_api_explorer-*.mkp
