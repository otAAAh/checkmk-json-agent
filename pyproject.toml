# SPDX-License-Identifier: GPL-2.0-only
[project]
name = "checkmk-json-agent"
version = "0.6.0"
description = "Generic Checkmk special agent for monitoring any HTTP/JSON API"
requires-python = ">=3.12"
license = "GPL-2.0-only"

# Metadata baked into the MKP manifest by scripts/build_mkp.py
[tool.mkp]
package_name = "json_api"
title = "Generic JSON API"
author = "Benjamin Knapp"
download_url = "https://github.com/otAAAh/checkmk-json-agent"
min_required = "2.4.0"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
# The cmk.* plugin APIs are only present inside a Checkmk site.
ignore_missing_imports = true
# The plugin ships several same-named modules (agent_based/json_api.py,
# graphing/json_api.py, ...) that are distinct plugin files in a site, not one
# package. These let mypy resolve them by their full path-derived name instead
# of colliding on the bare "json_api" module name.
namespace_packages = true
explicit_package_bases = true
