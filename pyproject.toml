# SPDX-License-Identifier: GPL-2.0-only
[project]
name = "checkmk-json-agent"
version = "0.10.0"
description = "Generic Checkmk special agent for monitoring any HTTP/JSON API"
requires-python = ">=3.12"
license = "GPL-2.0-only"

# Metadata baked into the MKP manifest by scripts/build_mkp.py
[tool.mkp]
package_name = "json_api"
title = "Generic JSON API"
author = "Benjamin Knapp"
download_url = "https://github.com/otAAAh/checkmk-json-agent"
min_required = "2.4.0"

# The Explorer ships as a SEPARATE, optional MKP (json_api_explorer) so the
# agent package above stays free of any non-public API dependency (its assets
# bind at runtime to Checkmk's internal cmk-frontend-vue bundle). It is a
# distinct package but shares the project version above — both MKPs release
# together at the same version to avoid confusion. See build_explorer() in
# scripts/build_mkp.py.
[tool.mkp.explorer]
package_name = "json_api_explorer"
title = "Generic JSON API - Explorer (extra)"
description = "Optional in-site JSON API Explorer for the Generic JSON API agent"
# The wizard imports cmk-frontend-vue's CmkWizard, which only exists in Checkmk
# 2.5+. The agent package stays at 2.4.0 (separate package, public APIs only).
min_required = "2.5.0"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
# The cmk.* plugin APIs are only present inside a Checkmk site.
ignore_missing_imports = true
# The plugin ships several same-named modules (agent_based/json_api.py,
# graphing/json_api.py, ...) that are distinct plugin files in a site, not one
# package. These let mypy resolve them by their full path-derived name instead
# of colliding on the bare "json_api" module name.
namespace_packages = true
explicit_package_bases = true
